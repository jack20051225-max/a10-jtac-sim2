<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>A-10 CAS JTAC Tactical Simulator - Fix</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #050b08; font-family: 'Courier New', Courier, monospace; color: #00ff66; }
        #game-container { width: 100vw; height: 100vh; position: relative; display: block; }
        #ui-header { position: absolute; top: 0; left: 0; width: 100%; display: flex; justify-content: space-around; align-items: center; height: 36px; background: #0a1610; border-bottom: 2px solid #005522; font-size: 11px; font-weight: bold; z-index: 10; }
        .label { color: #00aa44; }
        .green { color: #00ff66; }
        #canvas-wrapper { position: absolute; top: 36px; left: 0; right: 0; bottom: 0; background: #020604; overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; }
        #map-controls { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 6px; z-index: 5; }
        #map-controls button { width: 40px; height: 40px; background: rgba(10, 22, 16, 0.85); border: 1px solid #00ff66; color: #00ff66; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        #map-controls button:active { background: #00ff66; color: #000; }
        .alert-box { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(180, 0, 0, 0.9); color: #fff; border: 1px solid #ff4444; padding: 6px 12px; font-size: 11px; font-weight: bold; border-radius: 4px; z-index: 6; text-align: center; width: 85%; }
        .hidden { display: none !important; }

        /* 9-Line 戰術簡報與武器選擇視窗 */
        #target-modal {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 380px;
            background: rgba(8, 18, 12, 0.96);
            border: 2px solid #00ff66;
            border-radius: 8px;
            padding: 10px;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.3);
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 85vh;
            overflow-y: auto;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #005522; padding-bottom: 4px; }
        .modal-title { color: #ffff00; font-weight: bold; font-size: 12px; }
        .close-btn { background: none; border: none; color: #ff5555; font-size: 16px; font-weight: bold; cursor: pointer; padding: 0 5px; }
        .modal-body { font-size: 10px; line-height: 1.4; color: #00dd55; }
        .modal-body div { margin-bottom: 2px; }
        
        .weapon-select-section {
            border-top: 1px dashed #005522;
            padding-top: 4px;
            margin-top: 2px;
        }
        .weapon-label { color: #ffff00; font-size: 10px; font-weight: bold; margin-bottom: 3px; }
        .weapon-options { display: flex; gap: 4px; }
        .weapon-btn {
            flex: 1;
            padding: 5px 2px;
            background: #04120a;
            border: 1px solid #00aa44;
            color: #00aa44;
            font-family: inherit;
            font-size: 9px;
            font-weight: bold;
            border-radius: 3px;
            cursor: pointer;
            text-align: center;
        }
        .weapon-btn.selected {
            background: #007733;
            border-color: #00ff66;
            color: #ffffff;
            box-shadow: 0 0 5px rgba(0,255,102,0.5);
        }

        .action-btn { width: 100%; padding: 8px; background: #007733; border: 1px solid #00ff66; color: #ffffff; font-family: inherit; font-weight: bold; font-size: 11px; border-radius: 4px; cursor: pointer; margin-top: 4px; }
        .action-btn:active { background: #00ff66; color: #000; }
        
        /* 結算評價窗 */
        #score-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            max-width: 320px;
            background: rgba(5, 15, 10, 0.98);
            border: 2px solid #ffff00;
            border-radius: 8px;
            padding: 15px;
            z-index: 30;
            text-align: center;
            box-shadow: 0 0 20px rgba(255,255,0,0.4);
        }
        #score-title { color: #ffff00; font-size: 14px; font-weight: bold; margin-bottom: 8px; }
        #score-desc { color: #00ff66; font-size: 11px; line-height: 1.5; margin-bottom: 12px; text-align: left; }
        .score-close-btn { padding: 6px 15px; background: #007733; border: 1px solid #ffff00; color: #ffff00; font-family: inherit; font-weight: bold; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="game-container">
        <header id="ui-header">
            <div class="status-box"><span class="label">JTAC</span> <span id="callsign">ALPHA-1</span></div>
            <div class="status-box"><span class="label">A-10:</span> <span id="a10-status" class="green">INBOUND</span></div>
            <div class="status-box"><span class="label">SCORE:</span> <span id="score-display" class="green">0</span></div>
        </header>

        <main id="canvas-wrapper">
            <canvas id="tactical-map"></canvas>
            <div id="map-controls">
                <button id="btn-zoom-in">+</button>
                <button id="btn-zoom-out">-</button>
                <button id="btn-reset">CENTER</button>
            </div>
            <div id="danger-alert" class="alert-box hidden">⚠️ WARNING: FLIGHT PATH CROSSES SAM THREAT ZONE!</div>
        </main>

        <!-- 9-Line 簡報與武器選擇面板 -->
        <div id="target-modal" class="hidden">
            <div class="modal-header">
                <span id="modal-title" class="modal-title">9-LINE BRIEFING: OBJ-01</span>
                <button id="modal-close" class="close-btn">✕</button>
            </div>
            <div id="modal-body" class="modal-body"></div>
            
            <div class="weapon-select-section">
                <div class="weapon-label">8. SELECT WEAPON / 武器選擇:</div>
                <div class="weapon-options">
                    <button class="weapon-btn selected" data-weapon="mav">AGM-65 小牛</button>
                    <button class="weapon-btn" data-weapon="bomb">GBU-12 炸彈</button>
                    <button class="weapon-btn" data-weapon="gun">30mm 機砲</button>
                </div>
            </div>

            <button id="modal-action-btn" class="action-btn">► TRANSMIT 9-LINE & CLEARED HOT</button>
        </div>

        <!-- 任務結算與評價面板 -->
        <div id="score-modal" class="hidden">
            <div id="score-title">ATTACK ASSESSMENT</div>
            <div id="score-desc">評算內容...</div>
            <button class="score-close-btn" id="score-close">確認 / CONTINUE</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('tactical-map');
        const ctx = canvas.getContext('2d');
        const alertBox = document.getElementById('danger-alert');
        const targetModal = document.getElementById('target-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalBody = document.getElementById('modal-body');
        const modalClose = document.getElementById('modal-close');
        const modalActionBtn = document.getElementById('modal-action-btn');
        const a10StatusEl = document.getElementById('a10-status');
        const scoreDisplay = document.getElementById('score-display');
        const scoreModal = document.getElementById('score-modal');
        const scoreDesc = document.getElementById('score-desc');
        const scoreClose = document.getElementById('score-close');

        let camera = { x: 0, y: 0, zoom: 1, minZoom: 0.5, maxZoom: 2.5 };
        let isDragging = false;
        let startPan = { x: 0, y: 0 };
        let selectedTarget = null;
        let selectedWeapon = 'mav';
        let attackAnimation = null;
        let totalScore = 0;

        const mapData = {
            ip: { x: -200, y: -160, name: "IP DIXIE" },
            egress: { x: 180, y: -60, name: "EGRESS NORTH" },
            alphaTeam: { x: -140, y: 140, name: "ALPHA 1-1" },
            samSites: [
                { id: "SAM-1", x: 100, y: 120, radius: 100, name: "SAM-01 (SA-6)" },
                { id: "SAM-2", x: 150, y: -180, radius: 110, name: "SAM-02 (ZSU-23)" }
            ],
            targets: [
                { id: 1, code: "OBJ-01", name: "T-72 Tank Platoon", type: "ARMOR", x: -20, y: -30, elev: "450 FT", grid: "NV 341 882", bestWeapon: "mav", destroyed: false },
                { id: 2, code: "OBJ-02", name: "Supply Convoy", type: "VEHICLE", x: 40, y: 80, elev: "410 FT", grid: "NV 348 871", bestWeapon: "gun", destroyed: false },
                { id: 3, code: "OBJ-03", name: "Mortar Position", type: "INDIRECT FIRE", x: 110, y: -90, elev: "520 FT", grid: "NV 355 893", bestWeapon: "bomb", destroyed: false }
            ]
        };

        function resizeCanvas() {
            const wrapper = document.getElementById('canvas-wrapper');
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;
            drawMap();
        }
        window.addEventListener('resize', resizeCanvas);

        function drawMap() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(canvas.width / 2 + camera.x, canvas.height / 2 + camera.y);
            ctx.scale(camera.zoom, camera.zoom);

            drawGrid();
            drawSAMSites();
            drawFlightPath();
            drawFriendly();
            drawTargets();
            if (attackAnimation) drawAttackAnimation();

            ctx.restore();
        }

        function drawGrid() {
            ctx.strokeStyle = "#002211";
            ctx.lineWidth = 1 / camera.zoom;
            const gridSize = 80;
            const extent = 800;
            for (let x = -extent; x <= extent; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, -extent); ctx.lineTo(x, extent); ctx.stroke();
            }
            for (let y = -extent; y <= extent; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(-extent, y); ctx.lineTo(extent, y); ctx.stroke();
            }
        }

        function drawSAMSites() {
            mapData.samSites.forEach(sam => {
                ctx.beginPath();
                ctx.arc(sam.x, sam.y, sam.radius, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(255, 0, 0, 0.12)";
                ctx.fill();
                ctx.strokeStyle = "rgba(255, 60, 60, 0.7)";
                ctx.lineWidth = 1.5 / camera.zoom;
                ctx.setLineDash([4, 4]);
                ctx.stroke();
                ctx.setLineDash([]);

                ctx.fillStyle = "#ff5555";
                ctx.font = `${10 / camera.zoom}px Courier New`;
                ctx.fillText(sam.name, sam.x - 40, sam.y + sam.radius + 12);
            });
        }

        function drawFriendly() {
            ctx.fillStyle = "#00ffff";
            ctx.beginPath();
            ctx.arc(mapData.alphaTeam.x, mapData.alphaTeam.y, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.font = `${10 / camera.zoom}px Courier New`;
            ctx.fillText("▲ " + mapData.alphaTeam.name, mapData.alphaTeam.x + 10, mapData.alphaTeam.y + 3);
        }

        function drawTargets() {
            mapData.targets.forEach(tgt => {
                const isSelected = selectedTarget && selectedTarget.id === tgt.id;
                ctx.fillStyle = tgt.destroyed ? "#555555" : (isSelected ? "#ffff00" : "#ff3333");
                ctx.strokeStyle = tgt.destroyed ? "#777777" : (isSelected ? "#ffffff" : "#ff9999");
                ctx.lineWidth = (isSelected ? 2 : 1) / camera.zoom;

                ctx.beginPath();
                ctx.arc(tgt.x, tgt.y, 8, 0, Math.PI * 2);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.arc(tgt.x, tgt.y, 2, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = tgt.destroyed ? "#777777" : (isSelected ? "#ffff00" : "#ff6666");
                ctx.font = `${11 / camera.zoom}px Courier New`;
                ctx.fillText(tgt.destroyed ? tgt.code + " [DESTROYED]" : tgt.code, tgt.x + 12, tgt.y - 2);
                ctx.font = `${9 / camera.zoom}px Courier New`;
                ctx.fillText(tgt.type, tgt.x + 12, tgt.y + 9);
            });
        }

        function checkSAMIntersection(p1, p2) {
            let intersects = false;
            mapData.samSites.forEach(sam => {
                const dx = p2.x - p1.x;
                const dy = p2.y - p1.y;
                const len = Math.hypot(dx, dy);
                const u = Math.max(0, Math.min(1, ((sam.x - p1.x) * dx + (sam.y - p1.y) * dy) / (len * len)));
                const projX = p1.x + u * dx;
                const projY = p1.y + u * dy;
                const dist = Math.hypot(sam.x - projX, sam.y - projY);
                if (dist < sam.radius) intersects = true;
            });
            return intersects;
        }

        function drawFlightPath() {
            if (!selectedTarget) return;

            ctx.fillStyle = "#00ffff";
            ctx.font = `${10 / camera.zoom}px Courier New`;
            ctx.fillText("● " + mapData.ip.name, mapData.ip.x - 30, mapData.ip.y - 10);
            ctx.fillText("● " + mapData.egress.name, mapData.egress.x + 10, mapData.egress.y);

            const isIngressDanger = checkSAMIntersection(mapData.ip, selectedTarget);
            const isEgressDanger = checkSAMIntersection(selectedTarget, mapData.egress);

            if (isIngressDanger || isEgressDanger) {
                alertBox.classList.remove('hidden');
            } else {
                alertBox.classList.add('hidden');
            }

            ctx.lineWidth = 2 / camera.zoom;
            ctx.setLineDash([6, 4]);

            ctx.strokeStyle = isIngressDanger ? "#ff2222" : "#00ffff";
            ctx.beginPath();
            ctx.moveTo(mapData.ip.x, mapData.ip.y);
            ctx.lineTo(selectedTarget.x, selectedTarget.y);
            ctx.stroke();

            ctx.strokeStyle = isEgressDanger ? "#ff2222" : "#ffff00";
            ctx.beginPath();
            ctx.moveTo(selectedTarget.x, selectedTarget.y);
            ctx.lineTo(mapData.egress.x, mapData.egress.y);
            ctx.stroke();

            ctx.setLineDash([]);
        }

        function drawAttackAnimation() {
            const { p1, p2, p3, progress, target } = attackAnimation;
            let currentX, currentY, angle;

            if (progress < 0.5) {
                const t = progress / 0.5;
                currentX = p1.x + (p2.x - p1.x) * t;
                currentY = p1.y + (p2.y - p1.y) * t;
                angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);

                if (t > 0.7 && t < 0.95) {
                    ctx.strokeStyle = "#ffff00";
                    ctx.lineWidth = 2 / camera.zoom;
                    ctx.beginPath();
                    ctx.moveTo(currentX, currentY);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.stroke();
                }
                if (t >= 0.9) {
                    target.destroyed = true;
                    ctx.fillStyle = "rgba(255, 100, 0, 0.8)";
                    ctx.beginPath();
                    ctx.arc(p2.x, p2.y, (12 + Math.random() * 8) / camera.zoom, 0, Math.PI * 2);
                    ctx.fill();
                }
            } else {
                const t = (progress - 0.5) / 0.5;
                currentX = p2.x + (p3.x - p2.x) * t;
                currentY = p2.y + (p3.y - p2.y) * t;
                angle = Math.atan2(p3.y - p2.y, p3.x - p2.x);
            }

            ctx.save();
            ctx.translate(currentX, currentY);
            ctx.rotate(angle);
            ctx.fillStyle = "#00ff66";
            ctx.beginPath();
            ctx.moveTo(10 / camera.zoom, 0);
            ctx.lineTo(-8 / camera.zoom, -6 / camera.zoom);
            ctx.lineTo(-4 / camera.zoom, 0);
            ctx.lineTo(-8 / camera.zoom, 6 / camera.zoom);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        function startAttackRun() {
            if (!selectedTarget) return;
            targetModal.classList.add('hidden');
            a10StatusEl.textContent = "ATTACKING";
            a10StatusEl.className = "label";

            let startTime = null;
            const duration = 4000;

            attackAnimation = {
                p1: mapData.ip,
                p2: { x: selectedTarget.x, y: selectedTarget.y },
                p3: mapData.egress,
                progress: 0,
                target: selectedTarget
            };

            function step(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;
                attackAnimation.progress = Math.min(1, elapsed / duration);

                drawMap();

                if (attackAnimation.progress < 1) {
                    requestAnimationFrame(step);
                } else {
                    attackAnimation = null;
                    a10StatusEl.textContent = "MISSION COMPLETE";
                    a10StatusEl.className = "green";
                    evaluateAttack(selectedTarget, selectedWeapon);
                    drawMap();
                }
            }

            requestAnimationFrame(step);
        }

        function evaluateAttack(tgt, weapon) {
            let scoreAdd = 0;
            let resultText = "";
            const isDanger = checkSAMIntersection(mapData.ip, tgt) || checkSAMIntersection(tgt, mapData.egress);

            if (tgt.bestWeapon === weapon) {
                scoreAdd = 100;
                resultText = `✅ 【完美戰術執行 (EXCELLENT)】\n- 目標: ${tgt.code} (${tgt.name})\n- 武器選用: 符合目標特性最佳解！\n- 獲得分數: +100 分`;
            } else {
                scoreAdd = 40;
                resultText = `⚠️ 【武器配置次佳 (SUBOPTIMAL)】\n- 目標: ${tgt.code} (${tgt.name})\n- 武器選用: 雖成功摧毀，但彈藥效率不佳。\n- 獲得分數: +40 分`;
            }

            if (isDanger) {
                resultText += `\n⚠️ 警告: 航線穿過防空威脅區，承受額外戰術風險！`;
            }

            totalScore += scoreAdd;
            scoreDisplay.textContent = totalScore;
            scoreDesc.innerText = resultText;
            scoreModal.classList.remove('hidden');
        }

        canvas.addEventListener('click', (e) => {
            if (attackAnimation || !scoreModal.classList.contains('hidden')) return;
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            const mapX = (clickX - canvas.width / 2 - camera.x) / camera.zoom;
            const mapY = (clickY - canvas.height / 2 - camera.y) / camera.zoom;

            let clicked = null;
            mapData.targets.forEach(tgt => {
                const dist = Math.hypot(tgt.x - mapX, tgt.y - mapY);
                if (dist < 35 / camera.zoom) clicked = tgt;
            });

            if (clicked && !clicked.destroyed) {
                selectedTarget = clicked;
                showModal(clicked);
                drawMap();
            }
        });

        function showModal(tgt) {
            modalTitle.textContent = `9-LINE BRIEFING: ${tgt.code}`;
            modalBody.innerHTML = `
                <div><strong>1. IP/Heading:</strong> DIXIE / 125°</div>
                <div><strong>2. Distance:</strong> 4.2 NM</div>
                <div><strong>3. Target Elevation:</strong> ${tgt.elev}</div>
                <div><stron

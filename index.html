<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>A-10C FAC(A) Tactical Waypoint Planner</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #020503; font-family: 'Courier New', Courier, monospace; color: #00ff66; }
        #game-container { width: 100vw; height: 100vh; position: relative; background: #010302; }
        
        #ui-header { position: absolute; top: 0; left: 0; width: 100%; height: 45px; background: #06100a; border-bottom: 2px solid #004422; display: flex; justify-content: space-around; align-items: center; font-size: 10px; font-weight: bold; z-index: 10; }
        .label { color: #008844; }
        .green { color: #00ff66; }
        .yellow { color: #ffff00; }
        .red { color: #ff4444; }

        #canvas-wrapper { position: absolute; top: 45px; left: 0; right: 0; bottom: 0; background: #010302; }
        canvas { display: block; width: 100%; height: 100%; }

        #tactical-toolbar { position: absolute; top: 10px; left: 10px; display: flex; flex-direction: column; gap: 4px; z-index: 5; }
        .tool-btn { padding: 6px 9px; background: rgba(6, 16, 10, 0.95); border: 1px solid #008844; color: #008844; font-family: inherit; font-size: 8.5px; font-weight: bold; border-radius: 4px; cursor: pointer; text-align: left; }
        .tool-btn.active { border-color: #00ff66; color: #00ff66; background: rgba(0, 85, 34, 0.6); box-shadow: 0 0 8px rgba(0,255,102,0.4); }

        #map-controls { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 6px; z-index: 5; }
        #map-controls button { width: 40px; height: 40px; background: rgba(6, 16, 10, 0.9); border: 1px solid #00ff66; color: #00ff66; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        
        .alert-box { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(180, 0, 0, 0.95); color: #fff; border: 1px solid #ff0000; padding: 5px 10px; font-size: 9.5px; font-weight: bold; border-radius: 4px; z-index: 6; text-align: center; width: 65%; pointer-events: none; }
        .alert-box.danger { animation: flash 0.8s infinite; }
        .alert-box.safe { background: rgba(0, 100, 50, 0.95); border-color: #00ff66; }
        @keyframes flash { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        .hidden { display: none !important; }

        #target-modal { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); width: 95%; max-width: 410px; background: rgba(4, 12, 7, 0.98); border: 2px solid #00ff66; border-radius: 6px; padding: 10px; z-index: 20; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 0 15px rgba(0, 255, 102, 0.3); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #004422; padding-bottom: 4px; }
        .modal-title { color: #ffff00; font-weight: bold; font-size: 11px; }
        .close-btn { background: none; border: none; color: #ff5555; font-size: 16px; font-weight: bold; cursor: pointer; }
        
        .tgp-preview { width: 100%; height: 85px; background: #000; border: 1px solid #005522; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        .tgp-reticle { position: absolute; width: 34px; height: 34px; border: 1px dashed #00ff66; border-radius: 50%; }
        .tgp-text { position: absolute; bottom: 3px; left: 5px; font-size: 8px; color: #00ff66; background: rgba(0,0,0,0.8); padding: 2px; }

        .modal-body { font-size: 9px; line-height: 1.35; color: #00cc44; background: #010603; padding: 5px; border: 1px solid #003311; }
        .modal-body div { margin-bottom: 1px; }

        .weapon-select-section { border-top: 1px dashed #004422; padding-top: 4px; }
        .weapon-label { color: #ffff00; font-size: 9px; font-weight: bold; margin-bottom: 3px; }
        .weapon-options { display: flex; gap: 3px; }
        .weapon-btn { flex: 1; padding: 5px 2px; background: #030d07; border: 1px solid #008844; color: #008844; font-family: inherit; font-size: 8.5px; font-weight: bold; border-radius: 3px; text-align: center; cursor: pointer; }
        .weapon-btn.selected { background: #005522; border-color: #00ff66; color: #ffffff; }

        .action-btn { width: 100%; padding: 7px; background: #005522; border: 1px solid #00ff66; color: #ffffff; font-family: inherit; font-weight: bold; font-size: 10px; border-radius: 4px; cursor: pointer; margin-top: 2px; }

        #score-modal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 88%; max-width: 340px; background: rgba(3, 10, 6, 0.99); border: 2px solid #ffff00; border-radius: 8px; padding: 14px; z-index: 30; text-align: center; }
        #score-title { color: #ffff00; font-size: 12px; font-weight: bold; margin-bottom: 6px; }
        #score-desc { color: #00ff66; font-size: 10px; line-height: 1.4; margin-bottom: 10px; text-align: left; background: #010502; padding: 6px; border: 1px solid #004422; }
        .score-close-btn { width: 100%; padding: 6px; background: #005522; border: 1px solid #ffff00; color: #ffff00; font-family: inherit; font-weight: bold; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="game-container">
        <header id="ui-header">
            <div><span class="label">WAVE:</span> <span id="wave-display" class="green">1/3</span></div>
            <div><span class="label">MAV:</span> <span id="mav-count" class="green">4</span> | <span class="label">GBU:</span> <span id="gbu-count" class="green">2</span></div>
            <div><span class="label">SCORE:</span> <span id="score-display" class="green">0</span></div>
        </header>

        <div id="canvas-wrapper">
            <canvas id="tactical-map"></canvas>
            
            <div id="tactical-toolbar">
                <button class="tool-btn active" id="tool-target">🎯 攻擊目標模式</button>
                <button class="tool-btn" id="tool-ip">📍 設置進場點 (IP)</button>
                <button class="tool-btn" id="tool-waypoint">➕ 添加航點 (WP)</button>
                <button class="tool-btn" id="tool-egress">🏁 設置撤出點 (EGRESS)</button>
                <button class="tool-btn" id="tool-clear-wp" style="color: #ff5555; border-color: #aa2222;">🗑️ 清除中繼航點</button>
            </div>

            <div id="map-controls">
                <button id="btn-zoom-in">+</button>
                <button id="btn-zoom-out">-</button>
                <button id="btn-reset">CEN</button>
            </div>
            <div id="danger-alert" class="alert-box hidden">🚨 RWR: 航線穿過禁飛/防空區！</div>
        </div>

        <div id="target-modal" class="hidden">
            <div class="modal-header">
                <span id="modal-title" class="modal-title">9-LINE BRIEFING</span>
                <button id="modal-close" class="close-btn">✕</button>
            </div>
            
            <div class="tgp-preview" id="tgp-container">
                <div class="tgp-reticle"></div>
                <div class="tgp-text" id="tgp-info">FLIR/WH || TGP POINT TRK || PRF: 1688</div>
            </div>

            <div id="modal-body" class="modal-body"></div>
            
            <div class="weapon-select-section">
                <div class="weapon-label">ORDNANCE SELECT / 武器掛載選擇:</div>
                <div class="weapon-options">
                    <button class="weapon-btn selected" data-weapon="mav">AGM-65 (<span id="opt-mav">4</span>)</button>
                    <button class="weapon-btn" data-weapon="bomb">GBU-12 (<span id="opt-gbu">2</span>)</button>
                    <button class="weapon-btn" data-weapon="gun">30mm 機砲</button>
                </div>
            </div>

            <button id="modal-action-btn" class="action-btn">► TRANSMIT & CLEARED HOT</button>
        </div>

        <div id="score-modal" class="hidden">
            <div id="score-title">BATTLE DAMAGE ASSESSMENT</div>
            <div id="score-desc">評算內容</div>
            <button class="score-close-btn" id="score-close">確認 / CONTINUE</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('tactical-map');
        const ctx = canvas.getContext('2d');
        const alertBox = document.getElementById('danger-alert');
        const targetModal = document.getElementById('target-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalBody = document.getElementById('modal-body');
        const modalClose = document.getElementById('modal-close');
        const modalActionBtn = document.getElementById('modal-action-btn');
        const scoreDisplay = document.getElementById('score-display');
        const waveDisplay = document.getElementById('wave-display');
        const mavCountEl = document.getElementById('mav-count');
        const gbuCountEl = document.getElementById('gbu-count');
        const optMav = document.getElementById('opt-mav');
        const optGbu = document.getElementById('opt-gbu');
        const scoreModal = document.getElementById('score-modal');
        const scoreDesc = document.getElementById('score-desc');
        const scoreClose = document.getElementById('score-close');
        const tgpInfo = document.getElementById('tgp-info');

        let currentTool = 'target';
        document.getElementById('tool-target').addEventListener('click', () => setTool('target'));
        document.getElementById('tool-ip').addEventListener('click', () => setTool('ip'));
        document.getElementById('tool-waypoint').addEventListener('click', () => setTool('waypoint'));
        document.getElementById('tool-egress').addEventListener('click', () => setTool('egress'));
        document.getElementById('tool-clear-wp').addEventListener('click', () => {
            mapData.waypoints = [];
            drawMap();
        });

        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            if(tool === 'target') document.getElementById('tool-target').classList.add('active');
            if(tool === 'ip') document.getElementById('tool-ip').classList.add('active');
            if(tool === 'waypoint') document.getElementById('tool-waypoint').classList.add('active');
            if(tool === 'egress') document.getElementById('tool-egress').classList.add('active');
        }

        let camera = { x: 0, y: 0, zoom: 1, minZoom: 0.5, maxZoom: 2.5 };
        let isDragging = false;
        let startPan = { x: 0, y: 0 };
        let selectedTarget = null;
        let selectedWeapon = 'mav';
        let attackAnimation = null;
        
        let gameState = { score: 0, wave: 1, maxWaves: 3, ammoMav: 4, ammoGbu: 2, isGameOver: false };

        let mapData = {
            ip: { x: -180, y: 120, name: "IP DIXIE" },
            egress: { x: 180, y: 120, name: "EGRESS NORTH" },
            waypoints: [],
            alphaTeam: { x: -120, y: 60, name: "ALPHA 1-1" },
            noFlyZones: [], 
            targets: []
        };

        function generateCampaignWave() {
            mapData.ip = { x: -180, y: 130, name: "IP BAKER" };
            mapData.egress = { x: 180, y: 130, name: "EGRESS ALPHA" };
            mapData.waypoints = [];
            mapData.alphaTeam = { x: -100, y: 80, name: "ALPHA 1-1" };

            mapData.noFlyZones = [
                { x: 0, y: -110, radius: 65, name: "RESTRICTED PEAKS NORTH" },
                { x: -130, y: -20, radius: 55, name: "WESTERN HIGHWAY BLOCK" },
                { x: 130, y: -20, radius: 55, name: "EASTERN RIDGE" }
            ];

            mapData.targets = [];
            const tgtPool = [
                { name: "T-80BV Heavy Armor", type: "ARMOR", best: "mav", elev: "480 FT", prf: "1688" },
                { name: "BMP-3 Mechanized Infantry", type: "APC", best: "gun", elev: "410 FT", prf: "1689" },
                { name: "2S19 Msta Howitzer Battery", type: "ARTILLERY", best: "bomb", elev: "530 FT", prf: "1690" },
                { name: "Radar Station & Comms", type: "RADAR", best: "bomb", elev: "610 FT", prf: "1691" }
            ];

            const targetCount = 2 + gameState.wave;
            for (let i = 0; i < targetCount; i++) {
                let tDef = tgtPool[i % tgtPool.length];
                mapData.targets.push({
                    id: i + 1, code: `OBJ-0${i+1}`, name: tDef.name, type: tDef.type,
                    x: (i * 45) - ((targetCount - 1) * 22.5), y: (i % 2) * 20 - 10,
                    elev: tDef.elev, grid: `MGRS 38T LF ${420+i} ${190+i}`,
                    bestWeapon: tDef.best, prf: tDef.prf, destroyed: false
                });
            }
            updateUIStats();
        }

        function updateUIStats() {
            waveDisplay.textContent = `${gameState.wave}/${gameState.maxWaves}`;
            scoreDisplay.textContent = gameState.score;
            mavCountEl.textContent = gameState.ammoMav;
            gbuCountEl.textContent = gameState.ammoGbu;
            optMav.textContent = gameState.ammoMav;
            optGbu.textContent = gameState.ammoGbu;
        }

        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight - 45;
            drawMap();
        }

        window.addEventListener('resize', initCanvas);

        function drawMap() {
            ctx.fillStyle = "#010302";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(canvas.width / 2 + camera.x, canvas.height / 2 + camera.y);
            ctx.scale(camera.zoom, camera.zoom);
            drawGrid();
            drawNoFlyZones();
            drawFlightPath();
            drawFriendly();
            drawTargets();
            if (attackAnimation) drawAttackAnimation();
            ctx.restore();
        }

        function drawGrid() {
            ctx.strokeStyle = "#001a0d";
            ctx.lineWidth = 1 / camera.zoom;
            const gridSize = 60, extent = 600;
            for (let x = -extent; x <= extent; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, -extent); ctx.lineTo(x, extent); ctx.stroke();
            }
            for (let y = -extent; y <= extent; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(-extent, y); ctx.lineTo(extent, y); ctx.stroke();
            }
        }

        function drawNoFlyZones() {
            mapData.noFlyZones.forEach(nfz => {
                ctx.beginPath();
                ctx.arc(nfz.x, nfz.y, nfz.radius, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(255, 0, 0, 0.08)";
                ctx.fill();
                ctx.strokeStyle = "rgba(255, 50, 50, 0.4)";
                ctx.lineWidth = 1.5 / camera.zoom;
                ctx.setLineDash([4, 4]);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.fillStyle = "#ff5555";
                ctx.font = `${9 / camera.zoom}px Courier New`;
                ctx.fillText(`⛰️ ${nfz.name}`, nfz.x - 42, nfz.y + nfz.radius + 10);
            });
        }

        function drawFriendly() {
            ctx.fillStyle = "#00ffff";
            ctx.beginPath(); ctx.arc(mapData.ip.x, mapData.ip.y, 6, 0, Math.PI * 2); ctx.fill();
            ctx.font = `${10 / camera.zoom}px Courier New`;
            ctx.fillText("📍 " + mapData.ip.name, mapData.ip.x + 8, mapData.ip.y + 3);

            ctx.fillStyle = "#ffff00";
            ctx.beginPath(); ctx.arc(mapData.egress.x, mapData.egress.y, 6, 0, Math.PI * 2); ctx.fill();
            ctx.fillText("🏁 " + mapData.egress.name, mapData.egress.x + 8, mapData.egress.y + 3);

            mapData.waypoints.forEach((wp, index) => {
                ctx.fillStyle = "#00ffcc";
                ctx.beginPath(); ctx.arc(wp.x, wp.y, 4.5, 0, Math.PI * 2); ctx.fill();
                ctx.fillText(`WP-${index+1}`, wp.x + 8, wp.y + 3);
            });

            ctx.fillStyle = "#00ffff";
            ctx.beginPath(); ctx.arc(mapData.alphaTeam.x, mapData.alphaTeam.y, 5, 0, Math.PI * 2); ctx.fill();
            ctx.fillText("💬 " + mapData.alphaTeam.name, mapData.alphaTeam.x + 8, mapData.alphaTeam.y + 3);
        }

        function drawTargets() {
            mapData.targets.forEach(tgt => {
                const isSelected = selectedTarget && selectedTarget.id === tgt.id;
                ctx.fillStyle = tgt.destroyed ? "#444444" : (isSelected ? "#ffff00" : "#ff3333");
                ctx.strokeStyle = tgt.destroyed ? "#666666" : (isSelected ? "#ffffff" : "#ff9999");
                ctx.lineWidth = (isSelected ? 2 : 1) / camera.zoom;
                ctx.beginPath(); ctx.arc(tgt.x, tgt.y, 8, 0, Math.PI * 2); ctx.stroke();
                ctx.beginPath(); ctx.arc(tgt.x, tgt.y, 2.5, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = tgt.destroyed ? "#666666" : (isSelected ? "#ffff00" : "#ff6666");
                ctx.font = `${10 / camera.zoom}px Courier New`;
                ctx.fillText(tgt.destroyed ? tgt.code + " [DESTROYED]" : `${tgt.code} (${tgt.type})`, tgt.x + 12, tgt.y - 2);
            });
        }

        function checkSegmentIntersection(p1, p2) {
            let intersects = false;
            mapData.noFlyZones.forEach(nfz => {
                const dx = p2.x - p1.x, dy = p2.y - p1.y;
                const len = Math.hypot(dx, dy);
                if (len === 0) return;
                const u = Math.max(0, Math.min(1, ((nfz.x - p1.x) * dx + (nfz.y - p1.y) * dy) / (len * len)));
                const projX = p1.x + u * dx, projY = p1.y + u * dy;
                if (Math.hypot(nfz.x - projX, nfz.y - projY) < nfz.radius) intersects = true;
            });
            return intersects;
        }

        function drawFlightPath() {
            if (!selectedTarget) { alertBox.classList.add('hidden'); return; }
            let fullPath = [mapData.ip, ...mapData.waypoints, selectedTarget, mapData.egress];
            let hasDanger = false;
            ctx.lineWidth = 2 / camera.zoom;
            ctx.setLineDash([5, 3]);
            for (let i = 0; i < fullPath.length - 1; i++) {
                let p1 = fullPath[i], p2 = fullPath[i+1];
                let segmentDanger = checkSegmentIntersection(p1, p2);
                if (segmentDanger) hasDanger = true;
                ctx.strokeStyle = segmentDanger ? "#ff3333" : "#00ffcc";
                ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
            }
            ctx.setLineDash([]);
            if (hasDanger) {
                alertBox.textContent = "🚨 RWR: 航線穿過禁飛/防空區！請新增航點繞路";
                alertBox.className = "alert-box danger";
                alertBox.classList.remove('hidden');
            } else {
                alertBox.textContent = "✅ 戰術航線安全：成功利用地形通道避開威脅";
                alertBox.className = "alert-box safe";
                alertBox.classList.remove('hidden');
            }
        }

        function drawAttackAnimation() {
            const { path, progress, target } = attackAnimation;
            if (!path || path.length < 2) return;
            let totalSegs = path.length - 1;
            let currentFloatIndex = progress * totalSegs;
            let segIndex = Math.min(Math.floor(currentFloatIndex), totalSegs - 1);
            let t = currentFloatIndex - segIndex;
            let p1 = path[segIndex], p2 = path[segIndex+1];
            let currentX = p1.x + (p2.x - p1.x) * t, currentY = p1.y + (p2.y - p1.y) * t;
            let angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);

            if (segIndex >= totalSegs - 1 && t > 0.8) {
                target.destroyed = true;
                ctx.fillStyle = "rgba(255, 120, 0, 0.9)";

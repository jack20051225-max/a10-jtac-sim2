<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>A-10 CAS TGP & Threat Tactical Simulator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #030805; font-family: 'Courier New', Courier, monospace; color: #00ff66; }
        #game-container { width: 100vw; height: 100vh; position: relative; background: #010402; }
        
        #ui-header { position: absolute; top: 0; left: 0; width: 100%; height: 45px; background: #07120c; border-bottom: 2px solid #004422; display: flex; justify-content: space-around; align-items: center; font-size: 11px; font-weight: bold; z-index: 10; }
        .label { color: #008844; }
        .green { color: #00ff66; }
        .yellow { color: #ffff00; }
        .red { color: #ff3333; }

        #canvas-wrapper { position: absolute; top: 45px; left: 0; right: 0; bottom: 0; background: #010402; }
        canvas { display: block; width: 100%; height: 100%; }

        #map-controls { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 6px; z-index: 5; }
        #map-controls button { width: 42px; height: 42px; background: rgba(7, 18, 12, 0.9); border: 1px solid #00ff66; color: #00ff66; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        
        .alert-box { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: rgba(200, 0, 0, 0.95); color: #fff; border: 1px solid #ff0000; padding: 6px 14px; font-size: 11px; font-weight: bold; border-radius: 4px; z-index: 6; text-align: center; width: 85%; animation: flash 1s infinite; }
        @keyframes flash { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        .hidden { display: none !important; }

        /* TGP 擬真瞄準與 9-Line 互動視窗 */
        #target-modal {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 94%; max-width: 400px; background: rgba(5, 14, 9, 0.98);
            border: 2px solid #00ff66; border-radius: 6px; padding: 12px;
            z-index: 20; display: flex; flex-direction: column; gap: 8px;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #004422; padding-bottom: 4px; }
        .modal-title { color: #ffff00; font-weight: bold; font-size: 12px; letter-spacing: 1px; }
        .close-btn { background: none; border: none; color: #ff5555; font-size: 16px; font-weight: bold; cursor: pointer; }
        
        .tgp-preview { width: 100%; height: 110px; background: #000; border: 1px solid #005522; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        .tgp-reticle { position: absolute; width: 40px; height: 40px; border: 1px dashed #00ff66; border-radius: 50%; }
        .tgp-text { position: absolute; bottom: 4px; left: 6px; font-size: 9px; color: #00ff66; background: rgba(0,0,0,0.7); padding: 2px; }

        .modal-body { font-size: 10px; line-height: 1.4; color: #00cc44; background: #020804; padding: 6px; border: 1px solid #003311; }
        .modal-body div { margin-bottom: 2px; }

        .weapon-select-section { border-top: 1px dashed #004422; padding-top: 6px; }
        .weapon-label { color: #ffff00; font-size: 10px; font-weight: bold; margin-bottom: 4px; }
        .weapon-options { display: flex; gap: 4px; }
        .weapon-btn {
            flex: 1; padding: 6px 2px; background: #041008; border: 1px solid #008844;
            color: #008844; font-family: inherit; font-size: 9px; font-weight: bold; border-radius: 3px; text-align: center; cursor: pointer;
        }
        .weapon-btn.selected { background: #006622; border-color: #00ff66; color: #ffffff; box-shadow: inset 0 0 5px rgba(0,255,102,0.5); }

        .action-btn { width: 100%; padding: 9px; background: #006622; border: 1px solid #00ff66; color: #ffffff; font-family: inherit; font-weight: bold; font-size: 11px; border-radius: 4px; cursor: pointer; letter-spacing: 1px; }
        .action-btn:hover { background: #008833; }

        #score-modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 88%; max-width: 340px; background: rgba(4, 12, 8, 0.99);
            border: 2px solid #ffff00; border-radius: 8px; padding: 16px; z-index: 30; text-align: center;
        }
        #score-title { color: #ffff00; font-size: 14px; font-weight: bold; margin-bottom: 8px; }
        #score-desc { color: #00ff66; font-size: 11px; line-height: 1.5; margin-bottom: 14px; text-align: left; background: #010603; padding: 8px; border: 1px solid #004422; }
        .score-close-btn { width: 100%; padding: 8px; background: #006622; border: 1px solid #ffff00; color: #ffff00; font-family: inherit; font-weight: bold; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="game-container">
        <header id="ui-header">
            <div><span class="label">FAC(A)</span> <span id="callsign">HOG-1</span></div>
            <div><span class="label">STATUS:</span> <span id="a10-status" class="green">STATION</span></div>
            <div><span class="label">SCORE:</span> <span id="score-display" class="green">0</span></div>
        </header>

        <div id="canvas-wrapper">
            <canvas id="tactical-map"></canvas>
            <div id="map-controls">
                <button id="btn-zoom-in">+</button>
                <button id="btn-zoom-out">-</button>
                <button id="btn-reset">CEN</button>
            </div>
            <div id="danger-alert" class="alert-box hidden">🚨 RWR: SAM LOCK-ON! MISSILE THREAT DETECTED!</div>
        </div>

        <div id="target-modal" class="hidden">
            <div class="modal-header">
                <span id="modal-title" class="modal-title">9-LINE BRIEFING</span>
                <button id="modal-close" class="close-btn">✕</button>
            </div>
            
            <div class="tgp-preview" id="tgp-container">
                <div class="tgp-reticle"></div>
                <div class="tgp-text" id="tgp-info">FLIR/BW || TGP AREA TRK || PRF: 1688</div>
            </div>

            <div id="modal-body" class="modal-body"></div>
            
            <div class="weapon-select-section">
                <div class="weapon-label">ORDNANCE SELECT / 武器掛載選擇:</div>
                <div class="weapon-options">
                    <button class="weapon-btn selected" data-weapon="mav">AGM-65 (小牛)</button>
                    <button class="weapon-btn" data-weapon="bomb">GBU-12 (雷射炸彈)</button>
                    <button class="weapon-btn" data-weapon="gun">30mm (GAU-8 機砲)</button>
                </div>
            </div>

            <button id="modal-action-btn" class="action-btn">► READBACK & CLEARED HOT</button>
        </div>

        <div id="score-modal" class="hidden">
            <div id="score-title">BATTLE DAMAGE ASSESSMENT (BDA)</div>
            <div id="score-desc">評算內容</div>
            <button class="score-close-btn" id="score-close">確認 / CONTINUE</button>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('tactical-map');
        const ctx = canvas.getContext('2d');
        const alertBox = document.getElementById('danger-alert');
        const targetModal = document.getElementById('target-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalBody = document.getElementById('modal-body');
        const modalClose = document.getElementById('modal-close');
        const modalActionBtn = document.getElementById('modal-action-btn');
        const a10StatusEl = document.getElementById('a10-status');
        const scoreDisplay = document.getElementById('score-display');
        const scoreModal = document.getElementById('score-modal');
        const scoreDesc = document.getElementById('score-desc');
        const scoreClose = document.getElementById('score-close');
        const tgpInfo = document.getElementById('tgp-info');

        let camera = { x: 0, y: 0, zoom: 1, minZoom: 0.5, maxZoom: 2.5 };
        let isDragging = false;
        let startPan = { x: 0, y: 0 };
        let selectedTarget = null;
        let selectedWeapon = 'mav';
        let attackAnimation = null;
        let totalScore = 0;
        let isGameOver = false;

        let mapData = {
            ip: { x: -160, y: -150, name: "IP DIXIE" },
            egress: { x: 160, y: -70, name: "EGRESS NORTH" },
            alphaTeam: { x: -110, y: 110, name: "ALPHA 1-1" },
            samSites: [],
            targets: []
        }

        function generateRandomScenario() {
            const ipNames = ["IP DIXIE", "IP ALPHA", "IP BRAVO", "IP CHARLIE"];
            mapData.ip = { 
                x: -170 + Math.random() * 30, 
                y: -150 + Math.random() * 30, 
                name: ipNames[Math.floor(Math.random() * ipNames.length)] 
            };
            mapData.egress = { x: 140 + Math.random() * 40, y: -80 + Math.random() * 30, name: "EGRESS NORTH" };
            mapData.alphaTeam = { x: -110 + Math.random() * 20, y: 100 + Math.random() * 30, name: "ALPHA 1-1" };

            // 隨機防空陣地
            mapData.samSites = [];
            const samTypes = ["SA-6 Gainful (Kub)", "ZSU-23-4 Shilka", "SA-19 Tunguska"];
            const samCoords = [{ x: 60, y: 70 }, { x: 110, y: -100 }, { x: -40, y: -90 }];
            
            for (let i = 0; i < 2; i++) {
                let coord = samCoords[i];
                mapData.samSites.push({
                    id: `SAM-${i+1}`,
                    x: coord.x + (Math.random() * 20 - 10),
                    y: coord.y + (Math.random() * 20 - 10),
                    radius: 95,
                    name: `SAM-0${i+1} (${samTypes[Math.floor(Math.random() * samTypes.length)]})`
                });
            }

            // 目標配置：一個外圍安全點，兩個防空網深處高威脅點
            mapData.targets = [];
            const tgtPool = [
                { name: "T-72B3 Tank Platoon", type: "ARMOR", best: "mav", elev: "450 FT", prf: "1688" },
                { name: "BTR-82 Mechanized Squad", type: "APC", best: "gun", elev: "410 FT", prf: "1689" },
                { name: "2S19 Msta Self-Propelled Howitzer", type: "ARTILLERY", best: "bomb", elev: "520 FT", prf: "1690" }
            ];

            // 1. 外部安全目標 (引導熱身)
            let t1 = tgtPool[0];
            mapData.targets.push({
                id: 1, code: "OBJ-01", name: t1.name, type: t1.type,
                x: -20 + Math.random() * 15, y: 40 + Math.random() * 15,
                elev: t1.elev, grid: "NV 341 882", bestWeapon: t1.best, prf: t1.prf, destroyed: false
            });

            // 2. 內部防空網目標
            for (let i = 1; i < 3; i++) {
                let tDef = tgtPool[i];
                mapData.targets.push({
                    id: i + 1, code: `OBJ-0${i+1}`, name: tDef.name, type: tDef.type,
                    x: 70 + (i * 35) + Math.random() * 15, y: -40 + (i * 45) + Math.random() * 15,
                    elev: tDef.elev, grid: `NV ${340+i} ${870+i}`, bestWeapon: tDef.best, prf: tDef.prf, destroyed: false
                });
            }
        }

        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight - 45;
            drawMap();
        }

        window.addEventListener('resize', initCanvas);

        function drawMap() {
            ctx.fillStyle = "#010402";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(canvas.width / 2 + camera.x, canvas.height / 2 + camera.y);
            ctx.scale(camera.zoom, camera.zoom);

            drawGrid();
            drawSAMSites();
            drawFlightPath();
            drawFriendly();
            drawTargets();
            if (attackAnimation) drawAttackAnimation();

            ctx.restore();
        }

        function drawGrid() {
            ctx.strokeStyle = "#001a0d";
            ctx.lineWidth = 1 / camera.zoom;
            const gridSize = 60;
            const extent = 600;
            for (let x = -extent; x <= extent; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, -extent); ctx.lineTo(x, extent); ctx.stroke();
            }
            for (let y = -extent; y <= extent; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(-extent, y); ctx.lineTo(extent, y); ctx.stroke();
            }
        }

        function drawSAMSites() {
            mapData.samSites.forEach(sam => {
                ctx.beginPath();
                ctx.arc(sam.x, sam.y, sam.radius, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(255, 0, 0, 0.12)";
                ctx.fill();
                ctx.strokeStyle = "rgba(255, 50, 50, 0.6)";
                ctx.lineWidth = 1.5 / camera.zoom;
                ctx.setLineDash([5, 5]);
                ctx.stroke();
                ctx.setLineDash([]);

                ctx.fillStyle = "#ff4444";
                ctx.font = `${10 / camera.zoom}px Courier New`;
                ctx.fillText(`⚡ ${sam.name}`, sam.x - 40, sam.y + sam.radius + 12);
            });
        }

        function drawFriendly() {
            ctx.fillStyle = "#00ffff";
            ctx.beginPath();
            ctx.arc(mapData.alphaTeam.x, mapData.alphaTeam.y, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.font = `${10 / camera.zoom}px Courier New`;
            ctx.fillText("💬 " + mapData.alphaTeam.name + " (JTAC)", mapData.alphaTeam.x + 8, mapData.alphaTeam.y + 3);
        }

        function drawTargets() {
            mapData.targets.forEach(tgt => {
                const isSelected = selectedTarget && selectedTarget.id === tgt.id;
                ctx.fillStyle = tgt.destroyed ? "#444444" : (isSelected ? "#ffff00" : "#ff3333");
                ctx.strokeStyle = tgt.destroyed ? "#666666" : (isSelected ? "#ffffff" : "#ff9999");
                ctx.lineWidth = (isSelected ? 2 : 1) / camera.zoom;

                ctx.beginPath();
                ctx.arc(tgt.x, tgt.y, 9, 0, Math.PI * 2);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.arc(tgt.x, tgt.y, 2.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = tgt.destroyed ? "#666666" : (isSelected ? "#ffff00" : "#ff6666");
                ctx.font = `${11 / camera.zoom}px Courier New`;
                ctx.fillText(tgt.destroyed ? tgt.code + " [NEUTRALIZED]" : `${tgt.code} (${tgt.type})`, tgt.x + 12, tgt.y - 2);
            });
        }

        function checkSAMIntersection(p1, p2) {
            let intersects = false;
            mapData.samSites.forEach(sam => {
                const dx = p2.x - p1.x;
                const dy = p2.y - p1.y;
                const len = Math.hypot(dx, dy);
                if (len === 0) return;
                const u = Math.max(0, Math.min(1, ((sam.x - p1.x) * dx + (sam.y - p1.y) * dy) / (len * len)));
                const projX = p1.x + u * dx;
                const projY = p1.y + u * dy;
                const dist = Math.hypot(sam.x - projX, sam.y - projY);
                if (dist < sam.radius) intersects = true;
            });
            return intersects;
        }

        function drawFlightPath() {
            if (!selectedTarget) return;

            ctx.fillStyle = "#00ffff";
            ctx.font = `${10 / camera.zoom}px Courier New`;
            ctx.fillText("▲ " + mapData.ip.name, mapData.ip.x - 25, mapData.ip.y - 8);
            ctx.fillText("▲ " + mapData.egress.name, mapData.egress.x + 8, mapData.egress.y);

            const isIngressDanger = checkSAMIntersection(mapData.ip, selectedTarget);
            const isEgressDanger = checkSAMIntersection(selectedTarget, mapData.egress);

            if (isIngressDanger || isEgressDanger) {
                alertBox.classList.remove('hidden');
            } else {
                alertBox.classList.add('hidden');
            }

            ctx.lineWidth = 2 / camera.zoom;
            ctx.setLineDash([6, 4]);

            ctx.strokeStyle = isIngressDanger ? "#ff2222" : "#00ffff";
            ctx.beginPath();
            ctx.moveTo(mapData.ip.x, mapData.ip.y);
            ctx.lineTo(selectedTarget.x, selectedTarget.y);
            ctx.stroke();

            ctx.strokeStyle = isEgressDanger ? "#ff2222" : "#ffff00";
            ctx.beginPath();
            ctx.moveTo(selectedTarget.x, selectedTarget.y);
            ctx.lineTo(mapData.egress.x, mapData.egress.y);
            ctx.stroke();

            ctx.setLineDash([]);
        }

        function drawAttackAnimation() {
            const { p1, p2, p3, progress, target } = attackAnimation;
            let currentX, currentY, angle;

            if (progress < 0.5) {
                const t = progress / 0.5;
                currentX = p1.x + (p2.x - p1.x) * t;
                currentY = p1.y + (p2.y - p1.y) * t;
                angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);

                if (t > 0.6 && t < 0.95) {
                    ctx.strokeStyle = "#ffff00";
                    ctx.lineWidth = 2 / camera.zoom;
                    ctx.beginPath();
                    ctx.moveTo(currentX, currentY);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.stroke();
                }
                if (t >= 0.9) {
                    target.destroyed = true;
                    ctx.fillStyle = "rgba(255, 120, 0, 0.9)";
                    ctx.beginPath();
                    ctx.arc(p2.x, p2.y, (15 + Math.random() * 10) / camera.zoom, 0, Math.PI * 2);
                    ctx.fill();
                }
            } else {
                const t = (progress - 0.5) / 0.5;
                currentX = p2.x + (p3.x - p2.x) * t;
                currentY = p2.y + (p3.y - p2.y) * t;
                angle = Math.atan2(p3.y - p2.y, p3.x - p2.x);
            }

            ctx.save();
            ctx.translate(currentX, currentY);
            ctx.rotate(angle);
            ctx.fillStyle = "#00ff66";
            ctx.beginPath();
            ctx.moveTo(10 / camera.zoom, 0);
            ctx.lineTo(-8 / camera.zoom, -6 / camera.zoom);
            ctx.lineTo(-4 / camera.zoom, 0);
            ctx.lineTo(-8 / camera.zoom, 6 / camera.zoom);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        function startAttackRun() {
            if (!selectedTarget) return;
            targetModal.classList.add('hidden');
            alertBox.classList.add('hidden');
            a10StatusEl.textContent = "ATTACK RUN (IP-TGT)";
            a10StatusEl.className = "red";

            let startTime = null;
            const duration = 4500;

            attackAnimation = {
                p1: mapData.ip,
                p2: { x: selectedTarget.x, y: selectedTarget.y },
                p3: mapData.egress,
                progress: 0,
                target: selectedTarget
            };

            function step(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;
                attackAnimation.progress = Math.min(1, elapsed / duration);

                drawMap();

                if (attackAnimation.progress < 1) {
                    requestAnimationFrame(step);
                } else {
                    attackAnimation = null;
                    a10StatusEl.textContent = "ON STATION";
                    a10StatusEl.className = "green";
                    evaluateAttack(selectedTarget, selectedWeapon);
                    drawMap();
                }
            }

            requestAnimationFrame(step);
        }

        function evaluateAttack(tgt, weapon) {
            let scoreAdd = 0;
            let resultText = "";
            const isDanger = checkSAMIntersection(mapData.ip, tgt) || checkSAMIntersection(tgt, mapData.egress);

            if (tgt.bestWeapon === weapon) {
                scoreAdd = 150;
                resultText = `🎯 【完美武器匹配 (OPTIMAL ORDNANCE)】\n- 目標: ${tgt.code} (${tgt.name})\n- TGP 與雷射碼 (PRF ${tgt.prf}) 鎖定精準！\n- 獲得分數: +150 分`;
            } else {
                scoreAdd = 60;
                resultText = `⚠️ 【次佳武器配置 (SUBOPTIMAL)】\n- 目標: ${tgt.code} (${tgt.name})\n- 雖成功摧毀，但武器效率較差或耗費過多彈藥。\n- 獲得分數: +60 分`;
            }

            if (isDanger) {
                scoreAdd -= 30;
                resultText += `\n🚨 【RWR 警告】航線穿過防空雷達罩，遭受防空飛彈威脅反擊！(-30 分)`;
            }

            totalScore = Math.max(0, totalScore + scoreAdd);
            scoreDisplay.textContent = totalScore;

            const allDestroyed = mapData.targets.every(t => t.destroyed);
            if (allDestroyed) {
                isGameOver = true;
                resultText += `\n\n🏆 【全區肅清 - 任務圓滿成功 (FAC SUCESS)】\n所有敵方威脅已被清除。總分: ${totalScore}`;
                scoreClose.textContent = "重新部署新任務 / NEW FLIGHT";
            } else {
                scoreClose.textContent = "確認 / CONTINUE";
            }

            scoreDesc.innerText = resultText;
            scoreModal.classList.remove('hidden');
        }

        canvas.addEventListener('click', (e) => {
            if (attackAnimation || !scoreModal.classList.contains('hidden')) return;
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            const mapX = (clickX - canvas.width / 2 - camera.x) / camera.zoom;
            const mapY = (clickY - canvas.height / 2 - camera.y) / camera.zoom;

            let clicked = null;
            mapData.targets.forEach(tgt => {
                const dist = Math.hypot(tgt.x - mapX, tgt.y - mapY);
                if (dist < 45 / camera.zoom) clicked = tgt;
            });

            if (clicked && !clicked.destroyed) {
                selectedTarget = clicked;
                showModal(clicked);
                drawMap();
            }
        });

        function showModal(tgt) {
            modalTitle.textContent = `9-LINE BRIEFING: ${tgt.code}`;
            tgpInfo.textContent = `FLIR/WH || TGP POINT TRK || PRF CODE: ${tgt.prf}`;
            modalBody.innerHTML = `
                <div><strong>1. IP / Heading:</strong> ${mapData.ip.name} / 128°</div>
                <div><strong>2. Distance / Offset:</strong> 5.4 NM / LEFT</div>
                <div><strong>3. Target Elevation:</strong> ${tgt.elev}</div>
                <div><strong>4. Target Description:</strong> ${tgt.name}</div>
                <div><strong>5. Target Location:</strong> ${tgt.grid}</div>
                <div><strong>6. Marks:</strong> IR Pointer / Laser Code ${tgt.prf}</div>
                <div><strong>7. Friendlies:</strong> ${mapData.alphaTeam.name} (Marked)</div>
                <div><strong>8. Egress:</strong> NORTH via ${mapData.egress.name}</div>
            `;
            targetModal.classList.remove('hidden');
        }

        modalClose.addEventListener('click', () => {
            targetModal.classList.add('hidden');
            selectedTarget = null;
            drawMap();
        });

        document.querySelectorAll('.weapon-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.weapon-btn').forEach(b => b.classList.remove('selected'));
                e.target.classList.add('selected');
                selectedWeapon = e.target.getAttribute('data-weapon');
            });
        });

        modalActionBtn.addEventListener('click', () => {
            startAttackRun();
        });

        scoreClose.addEventListener('click', () => {
            scoreModal.classList.add('hidden');
            selectedTarget = null;
            if (isGameOver) {
                isGameOver = false;
                totalScore = 0;
                scoreDisplay.textContent = totalScore;
                generateRandomScenario();
            }
            drawMap();
        });

        canvas.addEventListener('mousedown', (e) => { isDragging = true; startPan = { x: e.clientX - camera.x, y: e.clientY - camera.y }; });
        window.addEventListener('mousemove', (e) => { if (isDragging) { camera.x = e.clientX - startPan.x; camera.y = e.clientY - startPan.y; drawMap(); } });
        window.addEventListener('mouseup', () => isDragging = false);

        canvas.addEventListener('touchstart', (e) => { if (e.touches.length === 1) { isDragging = true; startPan = { x: e.touches[0].clientX - camera.x, y: e.touches[0].clientY - camera.y }; } }, { passive: true });
        canvas.addEventListener('touchmove', (e) => { if (isDragging && e.touches.length === 1) { camera.x = e.touches[0].clientX - startPan.x; camera.y = e.touches[0].clientY - startPan.y; drawMap(); } }, { passive: true });
        canvas.addEventListener('touchend', () => isDragging = false);

        document.getElementById('btn-zoom-in').addEventListener('click', () => { camera.zoom = Math.min(camera.maxZoom, camera.zoom + 0.2); drawMap(); });
        document.getElementById('btn-zoom-out').addEventListener('click', () => { camera.zoom = Math.max(camera.minZoom, camera.zoom - 0.2); drawMap(); });
        document.getElementById('btn-reset').addEventListener('click', () => { camera.x = 0; camera.y = 0; camera.zoom = 1; drawMap(); });

        generateRandomScenario();
        initCanvas();
    </script>
</body>
</html>
